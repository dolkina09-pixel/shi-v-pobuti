:root{--ink:#2B2A27;--soft:#6A665E;--bg:#FFF8EC;--card:#fff;--line:#EFE6D3;--or:#E8692E;--or-d:#B84D1C;--gr:#2FAF7A;--gr-d:#1E8159;--gr-l:#E2F6EC;--yl:#FFC83D;--yl-d:#D99A0B;--yl-l:#FFF3CF;--bl:#4A8FE7;--rd:#E5484D;--rd-l:#FDECEC;--fs:17px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:var(--fs)}
html.lg{--fs:20px}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:'Golos Text',system-ui,sans-serif;overflow:hidden;-webkit-user-select:none;user-select:none}
button{font-family:inherit;color:inherit;cursor:pointer}
#top{position:fixed;top:0;left:0;right:0;height:58px;display:flex;align-items:center;gap:10px;padding:0 12px;background:var(--bg);z-index:5}
#stars{display:flex;align-items:center;gap:4px;font-size:1.2rem;font-weight:800;color:var(--yl-d)}
#pbar{flex:1;height:14px;background:#EFE6D3;border-radius:10px;overflow:hidden}
#pbar i{display:block;height:100%;width:0;background:var(--gr);border-radius:10px;transition:width .9s cubic-bezier(.3,1.4,.5,1);box-shadow:inset 0 -4px 0 rgba(0,0,0,.12)}
.tb{border:2px solid var(--line);border-bottom-width:4px;background:#fff;border-radius:14px;height:42px;padding:0 9px;font-size:.95rem;font-weight:800;display:flex;align-items:center;gap:4px}
.tb.on{border-color:var(--or);color:var(--or)}
#track{position:fixed;top:58px;bottom:78px;left:0;right:0;display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scrollbar-width:none;scroll-behavior:smooth}
#track::-webkit-scrollbar{display:none}
.s{flex:0 0 100%;height:100%;scroll-snap-align:center;display:flex;justify-content:center;padding:4px 10px 8px}
.c{width:100%;max-width:470px;height:100%;display:flex;flex-direction:column;gap:10px;position:relative;overflow-y:auto;overflow-x:hidden;scrollbar-width:none}
.c::-webkit-scrollbar{display:none}
.c>*{flex-shrink:0}
.host{flex:1 1 0!important;min-height:250px;display:flex;justify-content:center}
#bar{position:fixed;left:0;right:0;bottom:0;height:78px;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 12px 6px;background:var(--bg);border-top:2px solid var(--line);z-index:5}
#bar .btn{width:auto;padding:12px 18px;font-size:1.15rem}
#lvlname{font-size:1rem;font-weight:800;color:var(--soft);text-align:center;line-height:1.2}
/* кнопки з об'ємом */
.btn{display:block;width:100%;border:none;background:var(--or);color:#fff;font-size:1.3rem;font-weight:800;padding:15px 14px;border-radius:18px;box-shadow:0 5px 0 var(--or-d);transition:transform .08s,box-shadow .08s;text-align:center;text-decoration:none;line-height:1.2}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--or-d)}
.btn.gr{background:var(--gr);box-shadow:0 5px 0 var(--gr-d)}.btn.gr:active{box-shadow:0 1px 0 var(--gr-d)}
.btn.wh{background:#fff;color:var(--ink);border:2px solid var(--line);box-shadow:0 5px 0 var(--line)}.btn.wh:active{box-shadow:0 1px 0 var(--line)}
.btn.sm{font-size:1.05rem;padding:11px}
.btn:disabled{opacity:.35}
.pulse{animation:pulse 1.6s infinite}
@keyframes pulse{0%,100%{filter:none}50%{filter:brightness(1.12)}}
h1{font-size:1.85rem;line-height:1.1;margin:0;font-weight:800}
h2{font-size:1.55rem;line-height:1.15;margin:0;font-weight:800}
.badge{align-self:flex-start;background:var(--yl-l);color:#7A5200;font-size:.95rem;font-weight:800;padding:5px 12px;border-radius:20px}
/* Колобок і репліка */
.guide{display:flex;align-items:flex-end;gap:8px;min-height:74px}
.guide .kb{flex:none;width:68px;height:68px}
.bub{position:relative;flex:1;background:#fff;border:2px solid var(--line);border-radius:20px;padding:9px 13px;font-size:1.15rem;font-weight:700;line-height:1.3;box-shadow:0 4px 0 var(--line)}
.bub::before{content:'';position:absolute;left:-10px;bottom:16px;border:8px solid transparent;border-right-color:var(--line)}
.bub::after{content:'';position:absolute;left:-6px;bottom:17px;border:7px solid transparent;border-right-color:#fff}
.bub.ok{background:var(--gr-l);border-color:#9BDDBE}.bub.ok::after{border-right-color:var(--gr-l)}
.bub.no{background:var(--rd-l);border-color:#F3B6B8}.bub.no::after{border-right-color:var(--rd-l)}
.bub.pop{animation:bpop .35s}
@keyframes bpop{0%{transform:scale(.9);opacity:.4}100%{transform:none;opacity:1}}
.kb{overflow:visible}
.kb .body{transform-origin:50% 92%;animation:idle 2.8s ease-in-out infinite}
@keyframes idle{0%,100%{transform:translateY(0) scale(1,1)}50%{transform:translateY(-3px) scale(1.02,.98)}}
.kb .eyes{transform-origin:50% 45%;animation:blink 4.2s infinite}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
.kb .mouth-o{display:none}.kb.talk .mouth-s{display:none}.kb.talk .mouth-o{display:block;animation:talk .25s infinite alternate;transform-origin:50% 70%}
@keyframes talk{from{transform:scaleY(.4)}to{transform:scaleY(1)}}
.kb.happy .body{animation:hop .5s ease-in-out 3}
@keyframes hop{0%,100%{transform:translateY(0) scale(1,1)}30%{transform:translateY(-16px) scale(.95,1.05)}60%{transform:translateY(0) scale(1.08,.9)}}
.kb.happy .eyes{display:none}.kb .eyes-h{display:none}.kb.happy .eyes-h{display:block}
.kb.oops .body{animation:wob .45s ease-in-out 2}
@keyframes wob{0%,100%{transform:rotate(0)}25%{transform:rotate(-9deg)}75%{transform:rotate(9deg)}}
.kb .sweat{display:none}.kb.oops .sweat{display:block;animation:drip .9s}
@keyframes drip{from{transform:translateY(-4px);opacity:0}to{transform:translateY(4px);opacity:1}}
.kb .arm{transform-origin:85% 60%;animation:wave 1.4s ease-in-out infinite}
@keyframes wave{0%,100%{transform:rotate(0)}50%{transform:rotate(-22deg)}}
/* телефон-тренажер */
.phone{position:relative;flex:1;min-height:0;max-height:480px;width:100%;max-width:320px;align-self:stretch;margin:0 auto;border:9px solid #2B2A27;border-radius:36px;background:#fff;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 6px 0 #D8CDB8}
.phone::before{content:'';position:absolute;top:6px;left:50%;transform:translateX(-50%);width:70px;height:18px;border-radius:12px;background:#2B2A27;z-index:3}
.p-top{display:flex;justify-content:space-between;align-items:center;padding:30px 14px 6px;font-size:1rem;font-weight:800;color:#555}
.p-top span{font-size:1.25rem}
.p-msgs{flex:1;overflow:hidden;padding:4px 10px;display:flex;flex-direction:column;justify-content:flex-end;gap:6px}
.m{max-width:88%;padding:9px 12px;border-radius:18px;font-size:1rem;line-height:1.38;animation:mpop .3s}
@keyframes mpop{from{opacity:0;transform:translateY(10px) scale(.95)}to{opacity:1;transform:none}}
.m.u{align-self:flex-end;background:#F0EFEC;border-bottom-right-radius:6px}
.m.a{align-self:flex-start;color:var(--ink)}
.m.a b{color:var(--ink)}
.dots{display:inline-flex;gap:4px;padding:6px 2px}.dots i{width:8px;height:8px;border-radius:50%;background:#AAA;animation:dt 1s infinite}.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes dt{0%,100%{opacity:.3;transform:none}50%{opacity:1;transform:translateY(-3px)}}
.tools{display:flex;gap:6px;margin-top:6px}.tools span{width:34px;height:30px;border-radius:9px;display:inline-flex;align-items:center;justify-content:center;font-size:1rem;color:#777;border:1.5px solid #E5E2DA;background:#fff}
.p-bar{display:flex;align-items:center;gap:6px;margin:6px 8px 10px;padding:5px;border:1.5px solid #E2DED5;border-radius:26px;background:#fff}
.pb{flex:none;width:40px;height:40px;border-radius:50%;border:none;background:#F3F2EF;font-size:1.25rem;display:flex;align-items:center;justify-content:center;position:relative}
.pb.dark{background:#111;color:#fff}
.pf{flex:1;min-width:0;font-size:.95rem;color:#9A968D;padding:4px 2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pf.has{color:var(--ink)}
.pf .wave{display:inline-flex;gap:3px;align-items:center;height:18px;vertical-align:middle}.pf .wave i{width:4px;background:var(--or);border-radius:2px;animation:wv .5s infinite alternate}
.pf .wave i:nth-child(2){animation-delay:.1s}.pf .wave i:nth-child(3){animation-delay:.2s}.pf .wave i:nth-child(4){animation-delay:.3s}
@keyframes wv{from{height:4px}to{height:18px}}
.hl{position:relative;z-index:2;animation:ring 1.3s infinite!important}
@keyframes ring{0%{box-shadow:0 0 0 0 rgba(232,105,46,.75)}100%{box-shadow:0 0 0 16px rgba(232,105,46,0)}}
.hand{position:absolute;z-index:6;font-size:2.1rem;pointer-events:none;animation:hand 1s ease-in-out infinite;filter:drop-shadow(0 3px 2px rgba(0,0,0,.2))}
@keyframes hand{0%,100%{transform:translate(0,0)}50%{transform:translate(-5px,-9px) rotate(-6deg)}}
.chips{display:flex;flex-direction:column;gap:6px;padding:0 8px 4px;animation:mpop .3s}
.chip{border:2px solid var(--or);background:#FFF4EC;color:var(--ink);border-radius:14px;padding:8px 10px;font-size:.98rem;font-weight:700;text-align:left;line-height:1.25}
.sheet{position:absolute;left:0;right:0;bottom:0;background:#fff;border-radius:22px 22px 0 0;box-shadow:0 -6px 20px rgba(0,0,0,.15);padding:14px 12px 16px;display:flex;flex-direction:column;gap:8px;z-index:4;animation:up .3s}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
.si{display:flex;align-items:center;gap:12px;border:none;background:#F6F5F2;border-radius:14px;padding:12px;font-size:1.1rem;font-weight:700;text-align:left}
.full{position:absolute;inset:0;z-index:4;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;animation:fade .3s}
@keyframes fade{from{opacity:0}to{opacity:1}}
.vball{width:130px;height:130px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#BFE3FF,#4A8FE7 70%);animation:breathe 1.6s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.15)}}
.shutter{width:64px;height:64px;border-radius:50%;border:5px solid #fff;background:#fff;box-shadow:0 0 0 3px #111 inset}
.flash{position:absolute;inset:0;background:#fff;z-index:9;animation:fl .5s forwards;pointer-events:none}@keyframes fl{from{opacity:1}to{opacity:0}}
.thumb{width:46px;height:46px;border-radius:10px;background:#F1EEE6;display:inline-flex;align-items:center;justify-content:center;flex:none}
.again{align-self:center;border:none;background:none;color:var(--soft);font-size:1rem;font-weight:700;text-decoration:underline;padding:4px}
.real{width:40px;height:40px;border-radius:10px;border:1px solid #DDD;flex:none}
.app{display:flex;align-items:center;gap:8px;padding:8px 4px;border-bottom:1px solid #F0EEE8}
.app div{flex:1;min-width:0;font-size:.9rem;line-height:1.2}.app b{display:block;font-size:.98rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.app small{color:#888}
.get{border:none;background:#EAF2FD;color:#2B6FD6;font-weight:800;font-size:.85rem;padding:7px 10px;border-radius:14px}
.ring2{width:40px;height:40px;border-radius:50%;border:4px solid #DDE8F8;border-top-color:#2B6FD6;animation:spin 1s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.shake{animation:shake .4s}@keyframes shake{0%,100%{transform:none}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
/* плитки */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{border:2px solid var(--line);background:#fff;border-radius:20px;padding:14px 6px;font-size:1.15rem;font-weight:800;display:flex;flex-direction:column;align-items:center;gap:6px;box-shadow:0 5px 0 var(--line)}
.tile .e{font-size:2.6rem;line-height:1;animation:float 3s ease-in-out infinite}
.tile:nth-child(2) .e{animation-delay:.5s}.tile:nth-child(3) .e{animation-delay:1s}.tile:nth-child(4) .e{animation-delay:1.5s}.tile:nth-child(5) .e{animation-delay:.3s}.tile:nth-child(6) .e{animation-delay:.8s}
@keyframes float{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-6px) rotate(4deg)}}
.grid2.picked{grid-template-columns:repeat(3,1fr);gap:6px}.grid2.picked .tile{padding:6px 2px;font-size:.85rem;gap:2px;box-shadow:0 3px 0 var(--line)}.grid2.picked .tile .e{font-size:1.5rem}
.tile.on{border-color:var(--gr);background:var(--gr-l);box-shadow:0 5px 0 #9BDDBE}
.tile:active{transform:translateY(4px);box-shadow:0 1px 0 var(--line)}
/* кубики */
.slots{display:flex;flex-direction:column;gap:8px}
.slot{display:flex;align-items:center;gap:10px;min-height:52px;border:3px dashed #E5D9BF;border-radius:16px;padding:6px 10px;font-size:1.05rem;color:#B5A887;font-weight:700}
.slot .n{flex:none;font-size:1.4rem}
.slot.filled{border-style:solid;border-color:var(--gr);background:var(--gr-l);color:var(--ink);animation:bpop .3s}
.cubes{display:flex;flex-direction:column;gap:9px}
.cube{border:none;background:var(--yl);color:#5C3B00;font-weight:800;font-size:1.1rem;border-radius:16px;padding:12px;box-shadow:0 5px 0 var(--yl-d);text-align:left}
.cube.used{visibility:hidden}
/* смс */
.sms{background:#F0EFEC;border-radius:20px 20px 20px 6px;padding:12px 14px;font-size:1.08rem;line-height:1.42;animation:mpop .35s}
.from{font-size:.85rem;color:#888;font-weight:700;margin:0 0 4px 4px}
.vbtn{border:none;border-radius:20px;padding:16px 6px;font-size:1.25rem;font-weight:800}
.vbtn.r{background:var(--rd-l);color:#B3261E;box-shadow:0 5px 0 #F3B6B8}.vbtn.g{background:var(--gr-l);color:var(--gr-d);box-shadow:0 5px 0 #9BDDBE}
.vbtn:active{transform:translateY(4px);box-shadow:none}
/* документ */
.doc{background:#FFFDF6;border:2px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:4px;transform:rotate(-1.2deg);box-shadow:4px 5px 0 #EDE3CF}
.dl{border:none;background:none;text-align:left;font-size:1.08rem;padding:9px 10px;border-radius:9px;position:relative}
.dl.cov{color:transparent;background:#2B2A27}.dl.cov::after{content:'🙈';position:absolute;left:12px;top:5px;font-size:1.3rem;color:#fff}
/* ідеї */
.ideas{display:flex;flex-direction:column;gap:8px}
.idea{background:#fff;border:2px solid var(--line);border-radius:16px;padding:10px;box-shadow:0 4px 0 var(--line);animation:mpop .3s}
.idea p{margin:0 0 8px;font-size:1.08rem;font-weight:700;line-height:1.3}
.irow{display:flex;gap:8px}.irow .btn{font-size:1rem;padding:9px 6px}
.star.on{background:var(--yl);color:#5C3B00;box-shadow:0 5px 0 var(--yl-d)}
.fav{display:flex;gap:8px;align-items:center;background:var(--yl-l);border-radius:14px;padding:10px 12px;font-size:1.02rem;font-weight:700;border:none;text-align:left}
/* шпаргалка */
.cheat{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cheat div{background:#fff;border:2px solid var(--line);border-radius:18px;padding:10px;text-align:center;font-size:1.05rem;font-weight:800;box-shadow:0 4px 0 var(--line);animation:bpop .4s both}
.cheat div span{display:block;font-size:2rem;animation:float 3s infinite}
.rule{display:flex;gap:10px;align-items:center;background:#fff;border:2px solid var(--line);border-radius:16px;padding:10px 12px;font-size:1.05rem;font-weight:700;line-height:1.3}
.rule span{font-size:1.6rem;flex:none}
/* обкладинка */
.hero{position:relative;height:200px;flex:none}
.cloud{position:absolute;font-size:2.2rem;opacity:.9;animation:drift 16s linear infinite}
@keyframes drift{from{transform:translateX(-60px)}to{transform:translateX(420px)}}
.orb{position:absolute;width:54px;height:54px;border-radius:50%;background:#fff;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:1.7rem;box-shadow:0 4px 0 var(--line);animation:float 3.4s ease-in-out infinite}
.rot{display:inline-block;color:var(--or);transition:opacity .25s,transform .25s}
.trust{display:flex;gap:6px;flex-wrap:wrap}
.trust span{background:#fff;border:2px solid var(--line);border-radius:20px;padding:5px 10px;font-size:.92rem;font-weight:700}
/* карта */
#map{flex:1;min-height:0;width:100%}
.node{cursor:pointer}
.node .nr{transform-box:fill-box;transform-origin:center}
.node.next .nr{animation:nring 1.5s infinite}
@keyframes nring{0%{transform:scale(1);opacity:.6}100%{transform:scale(1.8);opacity:0}}
/* підказка */
.say{font-size:1.45rem;font-weight:800;line-height:1.25;text-align:center;margin:2px 0 0;min-height:1.8em;animation:bpop .35s}
.say.ok{color:var(--gr-d)}.say.no{color:#C2342F}
/* сцена-ситуація */
.scene{position:relative;height:210px;flex:none;border-radius:26px;background:#fff;border:2px solid var(--line);overflow:hidden}
.scene .sun{position:absolute;right:18px;top:14px;width:44px;height:44px;border-radius:50%;background:#FFE6A8;animation:float 4s ease-in-out infinite}
.scene .obj{position:absolute;font-size:4rem;line-height:1;animation:float 2.6s ease-in-out infinite;filter:drop-shadow(0 4px 0 rgba(0,0,0,.08))}
.scene .q{position:absolute;font-size:2.2rem;font-weight:800;color:var(--or);animation:qm 1.8s ease-in-out infinite}
@keyframes qm{0%,100%{transform:translateY(0) rotate(-8deg)}50%{transform:translateY(-8px) rotate(8deg)}}
.scene svg.man{position:absolute;bottom:0;left:22px;height:180px}
.man .hd{animation:tilt 3s ease-in-out infinite;transform-origin:50% 90%;transform-box:fill-box}
@keyframes tilt{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(4deg)}}
.man .ey{animation:blink 4s infinite;transform-origin:center;transform-box:fill-box}
.sit{font-size:1.9rem;font-weight:800;line-height:1.15;margin:4px 0 0}
.sitp{font-size:1.25rem;line-height:1.4;margin:0;color:var(--ink)}
.step{align-self:flex-start;font-size:1rem;font-weight:800;color:var(--soft)}
.can{display:flex;gap:12px;align-items:center;background:#fff;border:2px solid var(--line);border-radius:18px;padding:11px 12px;font-size:1.15rem;font-weight:700;line-height:1.25;box-shadow:0 4px 0 var(--line);animation:bpop .4s both}
.can span{font-size:2rem;flex:none;animation:float 3s ease-in-out infinite}
.can:nth-child(2) span{animation-delay:.6s}.can:nth-child(3) span{animation-delay:1.2s}
#win .big{font-size:4.5rem;line-height:1;animation:hop .6s ease-in-out 3}
/* перемога */
#win{position:fixed;inset:0;background:rgba(43,42,39,.55);display:none;align-items:center;justify-content:center;z-index:20;padding:18px}
#win.on{display:flex}
#win .box{background:#fff;border-radius:28px;padding:18px 18px 20px;max-width:390px;width:100%;text-align:center;animation:bpop .4s;display:flex;flex-direction:column;gap:10px;align-items:center}
#win .kb{width:120px;height:120px}
#win .st{font-size:2.2rem;letter-spacing:6px}#win .st span{display:inline-block;animation:sp .5s both}
@keyframes sp{from{transform:scale(0) rotate(-90deg)}to{transform:none}}
#win p{margin:0;font-size:1.1rem;color:var(--soft);line-height:1.4}
.cf{position:fixed;top:-14px;width:11px;height:15px;z-index:30;pointer-events:none;animation:fall 2s ease-in forwards}
@keyframes fall{to{transform:translateY(106vh) rotate(800deg)}}
#toast{position:fixed;left:50%;bottom:94px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:12px 18px;border-radius:30px;font-size:1.05rem;font-weight:700;z-index:25;opacity:0;transition:all .3s;pointer-events:none;white-space:nowrap}
#toast.on{opacity:1;transform:translateX(-50%)}
@media (max-height:640px){:root{--fs:15px}html.lg{--fs:17.5px}.hero{height:150px}.guide .kb{width:56px;height:56px}.host{min-height:220px}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-iteration-count:1!important}}
</style>
</head>
<body>
<div id="top"><div id="stars">⭐ <span id="sn">0</span></div><div id="pbar"><i></i></div><button class="tb" id="say" type="button">🔈</button><button class="tb" id="aa" type="button">A+</button></div>
<div id="track"></div>
<div id="bar"><button class="btn wh" id="prev" type="button">←</button><div id="lvlname"></div><button class="btn gr" id="next" type="button">→</button></div>
<div id="win" role="dialog" aria-modal="true"><div class="box"><div id="wkb"></div><h2 id="wt"></h2><div class="st" id="ws"></div><p id="wp"></p><button class="btn gr" id="wnext" type="button"></button><button class="btn wh sm" id="wmap" type="button"></button></div></div>

     P.hl(P.send,()=>{P.msg('u','<div class="thumb" style="width:90px;height:90px">'+BOILER+'</div>'+L.pq);P.setField('');P.ai(L.pa,()=>{sfx.ok();g.say(L.s4ok,'ok');setTimeout(()=>go(idx()+1),1800)})})})})})}
 run();againBtn(c,run);
},'l4');
slide(4,c=>{header(c,4,L.l4t2);const g=guide(c);g.say(L.s4e);
 c.insertAdjacentHTML('beforeend','<div class="doc"><b style="text-align:center;font-size:1.15rem">'+L.docT+'</b>'+L.doc.map(d=>'<button class="dl" type="button" data-s="'+d[1]+'">'+d[0]+'</button>').join('')+'</div>');
 let n=0;c.querySelectorAll('.dl').forEach(d=>d.onclick=()=>{if(d.dataset.s==='1'){if(!d.classList.contains('cov')){d.classList.add('cov');n++;sfx.tap();if(n===3){sfx.ok();g.say(L.s4ok2,'ok');setTimeout(()=>win(4),1100)}}}else{sfx.no();g.say(L.s4no,'no')}});
},'l4b');

/* ===== Рівень 5: кубики ===== */
intro(5);
slide(5,c=>{header(c,5,L.l5t);const g=guide(c);g.say(L.s5a);
 c.insertAdjacentHTML('beforeend','<div class="slots">'+L.slots.map(s=>'<div class="slot"><span class="n">'+s[0]+'</span><span>'+s[1]+'</span></div>').join('')+'</div><div class="cubes">'+[2,0,1].map(o=>'<button class="cube" type="button" data-o="'+o+'">'+L.cubes[o]+'</button>').join('')+'</div>');
 let need=0;const slots=[...c.querySelectorAll('.slot')];
 c.querySelectorAll('.cube').forEach(b=>b.onclick=()=>{if(+b.dataset.o!==need){sfx.no();b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake');g.say(L.cubeNo[need],'no');return}
  sfx.tap();slots[need].lastChild.textContent=b.textContent;slots[need].classList.add('filled');b.classList.add('used');need++;
  if(need<3)g.say(L.cubeGo[need]);else{sfx.ok();g.say(L.s5ok,'ok');setTimeout(()=>win(5),1300)}});
},'l5');

/* ===== Рівень 6: переслати ===== */
intro(6);
slide(6,c=>{header(c,6,L.l6t);const g=guide(c);const host=document.createElement('div');host.className='host';c.appendChild(host);
 function run(){host.innerHTML='';const P=phone(host);P.msg('u',L.borschQ);const m=P.msg('a',L.borsch+'<div class="tools"><span class="cp">⧉</span><span>👍</span><span>🔈</span></div>');
  g.say(L.s6a);P.hl(m.querySelector('.cp'),()=>{toast(L.copied);sfx.ok();setTimeout(()=>{host.innerHTML='';const V=phone(host,{top:'💬 '+L.family});V.el.querySelector('.p-top').style.background='#EFECFF';V.msg('a',L.famMsg);
   g.say(L.s6b);V.hl(V.field,()=>{const pop=document.createElement('button');pop.type='button';pop.className='chip';pop.style.cssText='position:absolute;left:30px;bottom:64px;z-index:5;background:#2B2A27;color:#fff;border-color:#2B2A27;font-size:1.05rem';pop.textContent=L.paste;V.el.appendChild(pop);g.say(L.s6c);
    V.hl(pop,()=>{pop.remove();V.setField(L.borsch);g.say(L.s2c);V.hl(V.send,()=>{V.msg('u',L.borsch+' <small style="color:#2FAF7A">✓✓</small>');V.setField('');sfx.ok();g.say(L.s6ok,'ok');setTimeout(()=>win(6),1300)})})})},700)})}
 run();againBtn(c,run);
},'l6');

/* ===== Рівень 7: шахраї ===== */
intro(7);
slide(7,c=>{header(c,7,L.l7t);const g=guide(c);const box=document.createElement('div');box.style.cssText='display:flex;flex-direction:column;gap:10px';c.appendChild(box);let k=0,ok=0;
 function show(){const s=L.sms[k];g.say(L.s7q.replace('{n}',k+1));box.innerHTML='<div><p class="from">'+s[0]+'</p><div class="sms">'+s[1]+'</div></div><div class="grid2"><button class="vbtn r" type="button" data-a="1">'+L.scam+'</button><button class="vbtn g" type="button" data-a="0">'+L.safe+'</button></div>';
  box.querySelectorAll('.vbtn').forEach(b=>b.onclick=()=>{const r=+b.dataset.a===s[2];if(r){ok++;sfx.ok()}else sfx.no();g.say((r?L.yes:L.no)+' '+s[3],r?'ok':'no');
   box.querySelector('.grid2').outerHTML='<button class="btn gr" type="button" id="snext">'+(k<2?L.nextMsg:L.finish)+'</button>';box.querySelector('#snext').onclick=()=>{if(k<2){k++;show()}else win(7)}})}
 show();
},'l7');

/* ===== Рівень 8: перевіряйте ===== */
intro(8);
slide(8,c=>{header(c,8,L.l8t);const g=guide(c);const host=document.createElement('div');host.className='host';c.appendChild(host);
 function run(){host.innerHTML='';const P=phone(host);P.msg('u',L.subQ);g.say(L.s8a);
  P.ai(L.subA,()=>{g.say(L.s8b);P.chips([L.blind,L.askLink],i=>{if(i===0){sfx.no();g.say(L.s8no,'no');setTimeout(run,2200);return}
   P.setField(L.askLink2);g.say(L.s2c);P.hl(P.send,()=>{P.msg('u',L.askLink2);P.setField('');P.ai(L.linkA,()=>{sfx.ok();g.say(L.s8ok,'ok');setTimeout(()=>win(8),1500)},'<div style="margin-top:6px;padding:8px 10px;border-radius:12px;background:#EAF2FD;color:#2B6FD6;font-weight:800">🔗 pfu.gov.ua</div>')})})})}
 run();againBtn(c,run);
},'l8');

/* ===== Рівень 9: ваші ідеї ===== */
let favs=LS.get('favs',[]);
intro(9);
slide(9,c=>{header(c,9,L.l9t);const g=guide(c);g.say(L.s9a);
 c.insertAdjacentHTML('beforeend','<div class="grid2" id="spheres">'+L.spheres.map((s,i)=>'<button class="tile" type="button" data-i="'+i+'"><span class="e">'+s[0]+'</span>'+s[1]+'</button>').join('')+'</div><div class="ideas" id="ideas"></div>');
 const ideas=c.querySelector('#ideas');
 function showSphere(i){c.querySelector('#spheres').classList.add('picked');c.querySelectorAll('#spheres .tile').forEach(t=>t.classList.toggle('on',+t.dataset.i===i));const s=L.spheres[i];g.say(L.s9b);
  ideas.innerHTML=s[2].map(q=>'<div class="idea"><p>«'+q+'»</p><div class="irow"><button class="btn sm try" type="button">'+L.tryIt+'</button><button class="btn wh sm star'+(favs.includes(q)?' on':'')+'" type="button">★ '+L.save+'</button></div></div>').join('');
  ideas.querySelectorAll('.idea').forEach((el,j)=>{const q=s[2][j];el.querySelector('.try').onclick=()=>openGPT(q);
   el.querySelector('.star').onclick=e=>{if(!favs.includes(q)){favs.push(q);LS.set('favs',favs);e.currentTarget.classList.add('on');sfx.ok();toast(L.saved);renderFavs&&renderFavs();if(!done.includes(9))setTimeout(()=>win(9),900)}}});
  setTimeout(()=>ideas.firstChild&&ideas.firstChild.scrollIntoView({behavior:'smooth',block:'nearest'}),100)}
 c.querySelectorAll('#spheres .tile').forEach(t=>t.onclick=()=>{sfx.tap();showSphere(+t.dataset.i)});
},'l9');

/* ===== Рівень 10: шпаргалка + мої картки ===== */
let renderFavs;
slide(10,c=>{guide(c).say(L.l10t);
 c.insertAdjacentHTML('beforeend','<div class="cheat">'+L.cheat.map((x,i)=>'<div style="animation-delay:'+i*.12+'s"><span>'+x[0]+'</span>'+x[1]+'</div>').join('')+'</div>'+L.rules.map(r=>'<div class="rule"><span>'+r[0]+'</span>'+r[1]+'</div>').join('')+'<button class="btn" id="tofin" type="button">'+L.l10next+'</button>');
 c.querySelector('#tofin').onclick=()=>go(idx()+1);
},'l10');
slide(10,c=>{header(c,10,L.l10t2);const g=guide(c);g.say(L.s10a);
 c.insertAdjacentHTML('beforeend','<div class="ideas" id="favs"></div><a class="btn" id="viber" style="background:#7360F2;box-shadow:0 5px 0 #5443C9">'+L.viber+'</a><button class="btn wh sm" id="other" type="button">'+L.other+'</button><button class="btn gr" id="fin" type="button">'+L.finishGame+'</button>');
 const msg=L.shareMsg+' 👉 '+SITE+(LANG==='ru'?'v2/ru/':'v2/');c.querySelector('#viber').href='viber://forward?text='+encodeURIComponent(msg);
 c.querySelector('#other').onclick=()=>{if(navigator.share)navigator.share({text:msg}).catch(()=>{});else{copy(msg);toast(L.copied)}};
 renderFavs=()=>{const f=c.querySelector('#favs');f.innerHTML=favs.length?'<b style="font-size:1.1rem">'+L.myCards+'</b>'+favs.map(q=>'<button class="fav" type="button">★ '+q+'</button>').join(''):'';f.querySelectorAll('.fav').forEach((b,j)=>b.onclick=()=>openGPT(favs[j]))};
 renderFavs();c.querySelector('#fin').onclick=()=>win(10);
},'fin');

/* ---------- побудова, навігація ---------- */
SL.forEach(x=>x.build(x.c));stars();
const prev=$('#prev'),next=$('#next'),ln=$('#lvlname');
function upd(){const i=idx(),x=SL[i];prev.disabled=i===0;next.disabled=i===SL.length-1;ln.textContent=x.lvl?L.lvl.replace('{n}',x.lvl):'';
 LS.set('pos',i);if(speaking){speechSynthesis.cancel();speaking=false;$('#say').classList.remove('on')}}
let raf;track.addEventListener('scroll',()=>{cancelAnimationFrame(raf);raf=requestAnimationFrame(upd)},{passive:true});
prev.onclick=()=>{sfx.tap();go(idx()-1)};
next.onclick=()=>{sfx.tap();const x=SL[idx()];go(idx()+1)};
addEventListener('keydown',e=>{if(e.key==='ArrowRight')next.click();if(e.key==='ArrowLeft')prev.click()});
/* вголос, А+ */
const aa=$('#aa');if(LS.get('lg',false)){document.documentElement.classList.add('lg');aa.classList.add('on')}
aa.onclick=()=>{const on=document.documentElement.classList.toggle('lg');aa.classList.toggle('on',on);LS.set('lg',on);toast(on?L.bigOn:L.bigOff)};
let speaking=false;const sayB=$('#say');
sayB.onclick=()=>{if(!('speechSynthesis' in window)){toast(L.noVoice);return}if(speaking){speechSynthesis.cancel();speaking=false;sayB.classList.remove('on');return}
 const c=SL[idx()].c;const t=[...c.querySelectorAll('h1,h2,.bub,.sms,.rule,.idea p,.doc b')].map(e=>e.innerText).join('. ').replace(/[\u{1F300}-\u{1FAFF}☀-➿️]/gu,'');
 const u=new SpeechSynthesisUtterance(t);u.lang=L.voice;u.rate=.9;const v=speechSynthesis.getVoices().find(v=>v.lang&&v.lang.toLowerCase().startsWith(L.voice.slice(0,2)));if(v)u.voice=v;
 u.onend=u.onerror=()=>{speaking=false;sayB.classList.remove('on')};speechSynthesis.cancel();speechSynthesis.speak(u);speaking=true;sayB.classList.add('on')};
const p0=LS.get('pos',0);requestAnimationFrame(()=>{go(p0,false);upd()});
addEventListener('resize',()=>go(idx(),false));
if('serviceWorker' in navigator&&location.protocol==='https:')addEventListener('load',()=>navigator.serviceWorker.register('../../sw.js').catch(()=>{}));
})();
</script>
